name: Godot CI Exports

on:
  push: {}
  pull_request: {}

jobs:
  export-game:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.2-stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true

      - name: Build Project
        run: |
          mkdir -p build/linux build/windows build/macos
          
          # Preset names must match your export_presets.cfg exactly
          godot --headless --verbose --export-release "Linux" build/linux/Backrooms.x86_64
          godot --headless --verbose --export-release "Windows Desktop" build/windows/Backrooms.exe
          godot --headless --verbose --export-release "macOS" build/macos/Backrooms.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Backrooms-Builds
          path: |
            build/linux/
            build/windows/
            build/macos/